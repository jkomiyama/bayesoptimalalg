name = "junpei_version_lean"
version = "0.1.0"
defaultTargets = ["JunpeiVersionLean"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.24.0"

[[lean_lib]]
name = "Draft0"
globs = ["Draft0.+"]

[[lean_lib]]
name = "Junpei"
globs = ["Junpei.+"]

[[lean_lib]]
name = "JunpeiVersionLean"
